spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false               # 운영은 SQL 로그 끔
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}   # 운영 도메인 (프론트/앱)

# FastAPI AI 서버 (프라이빗 서브넷 내부 주소)
ai-server:
  base-url: ${AI_SERVER_URL}
  connect-timeout: 3000
  read-timeout: 30000
